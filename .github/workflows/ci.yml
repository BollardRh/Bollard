name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build and sizes
        working-directory: contracts
        run: forge build --sizes
      - name: Adversarial suite (doc §3.13)
        working-directory: contracts
        run: forge test

  services:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # supabase/migrations are applied to a fresh database by services/test/db.test.ts
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # anvil + compiled contracts for services/test/e2e.test.ts
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts
        working-directory: contracts
        run: forge build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Banned words
        run: bun run banned-words
